<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scorebug Overlay</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  /* Designed on a fixed 1920x1080 stage and scaled to whatever size the
     OBS Browser Source is. Needs OBS 28+ (Chromium 103+). */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:transparent;overflow:hidden}
  body{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;color:#fff;
       -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
  body.checker{background:#2b2f36 conic-gradient(#3a3f47 25%,#2b2f36 0 50%,#3a3f47 0 75%,#2b2f36 0) 0 0/40px 40px}

  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
  #bug{position:absolute;--panel:#0f1319;--accent:#ffc20e}

  #inner{display:inline-flex;flex-direction:column;align-items:center;position:relative;
         clip-path:inset(-90px -90px -90px -90px);opacity:1;
         transition:clip-path .7s cubic-bezier(.65,0,.25,1),opacity .5s ease,transform .7s cubic-bezier(.65,0,.25,1)}
  #inner.off{clip-path:inset(-90px 50% -90px 50%);opacity:0;transform:scale(.97)}

  /* ---------- main bar ---------- */
  .bar{display:flex;height:84px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5)) drop-shadow(0 2px 3px rgba(0,0,0,.4))}

  .team{position:relative;display:flex;align-items:stretch;height:84px;background:var(--c1);color:var(--t1);
        transition:background-color .5s}
  .team.left{border-radius:12px 0 0 12px}
  .team.right{border-radius:0 12px 12px 0;flex-direction:row-reverse}
  .team::after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;border-radius:inherit;pointer-events:none;
        background:linear-gradient(180deg,rgba(255,255,255,.20) 0%,rgba(255,255,255,.04) 42%,rgba(0,0,0,.20) 100%)}

  .logo{flex:none;width:98px;display:flex;align-items:center;justify-content:center;
        background:rgba(0,0,0,.16);position:relative;z-index:1}
  .logo img{width:68px;height:68px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
  .logo.plate-white img{background:#fff;border-radius:50%;padding:7px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
  .logo.plate-dark img{background:rgba(8,10,14,.82);border-radius:50%;padding:7px}

  .tname{flex:none;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;
         padding:0 18px;position:relative;z-index:1;width:230px;overflow:visible}
  .team.right .tname{align-items:flex-end;text-align:right}
  .nm{display:inline-block;white-space:nowrap;font-weight:700;font-size:46px;line-height:.98;
      text-transform:uppercase;letter-spacing:.6px;text-shadow:0 1px 2px rgba(0,0,0,.28)}
  .rec{display:none;font-weight:500;font-size:21px;line-height:1;letter-spacing:1.6px;opacity:.82;margin-top:2px;white-space:nowrap}

  .poss{flex:none;width:0;overflow:hidden;display:flex;align-items:center;justify-content:center;
        position:relative;z-index:1;transition:width .35s cubic-bezier(.3,1.3,.5,1)}
  .poss.on{width:40px}
  .poss svg{width:30px;height:30px;fill:var(--accent);filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}

  .score{flex:none;width:106px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;
         background:var(--c2);color:var(--t2);font-weight:800;font-size:68px;line-height:1;overflow:hidden;
         font-variant-numeric:tabular-nums;transition:background-color .5s}
  .score .val{display:inline-block;transform-origin:center}
  .score::before{content:"";position:absolute;left:0;top:0;right:0;bottom:0;background:#fff;opacity:0;pointer-events:none}
  .score.flash::before{animation:scoreflash 1.1s ease-out}
  @keyframes scoreflash{0%{opacity:.9}100%{opacity:0}}

  /* timeouts / fouls / sets row hanging under each team */
  .foot{position:absolute;left:0;right:0;top:100%;height:25px;display:flex;align-items:center;justify-content:space-between;
        padding:0 14px;background:#0b0e13;border-top:3px solid var(--c2);color:#d3dae3;
        font-size:18px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;z-index:0;
        box-shadow:inset 0 -6px 10px rgba(0,0,0,.35)}
  .team.left .foot{border-radius:0 0 0 12px}
  .team.right .foot{border-radius:0 0 12px 0;flex-direction:row-reverse}
  .foot .grp{display:flex;align-items:center;gap:7px}
  .foot .lbl{opacity:.75}
  .pip{width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 0 5px rgba(255,255,255,.35)}
  .pip.off{background:rgba(255,255,255,.17);box-shadow:none}
  .pip.set{background:var(--accent);box-shadow:0 0 6px rgba(255,194,14,.45)}
  .pip.set.off{background:rgba(255,255,255,.17);box-shadow:none}
  .bonus{color:var(--accent);font-weight:800}
  .sport-baseball .foot{display:none}
  /* volleyball has a set-score strip under the centre: keep foot items on the outer edges so they never sit under it */
  .sport-volleyball .foot{justify-content:flex-start;gap:20px}

  /* ---------- centre block ---------- */
  .center{flex:none;min-width:176px;padding:0 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;
          background:var(--panel);position:relative;z-index:2;box-shadow:0 0 0 1px rgba(255,255,255,.04) inset}
  .center::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--accent)}
  .per{font-weight:700;font-size:25px;line-height:1;letter-spacing:3.5px;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
  .clk{font-weight:700;font-size:56px;line-height:.94;font-variant-numeric:tabular-nums;letter-spacing:.5px;min-width:3.4ch;text-align:center}
  .sport-volleyball .clk{font-size:60px}
  .clkrow{display:flex;align-items:baseline;justify-content:center;gap:10px}
  .add{display:none;font-weight:800;font-size:34px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
  .add.on{display:block}
  .center.noclk{min-width:132px}
  .center.noclk .clkrow{display:none}
  .center.noclk .per{margin-bottom:0;font-size:30px}
  /* soccer cards under each team (only shown once a card has been shown) */
  .foot.nocards{display:none}
  .card{width:15px;height:21px;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.5)}
  .card.y{background:#ffd400}.card.r{background:#e5222d}
  .sport-soccer .foot{justify-content:flex-start;gap:22px}
  .sport-soccer .team.right .foot{justify-content:flex-start}
  .lamp.pg{background:#3ddc84;box-shadow:0 0 8px rgba(61,220,132,.6)}
  .lamp.pm{background:#ff4d4f;box-shadow:0 0 8px rgba(255,77,79,.6)}
  .sport-baseball .center{flex-direction:row;gap:20px;min-width:210px}
  .inn{display:flex;align-items:center;gap:8px}
  .inn .tri{width:24px;height:24px;fill:var(--accent);transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
  .inn .tri.bot{transform:rotate(180deg)}
  .innnum{font-weight:800;font-size:62px;line-height:1;font-variant-numeric:tabular-nums}
  .dia{width:62px;height:62px;overflow:visible}
  .dia .base{fill:rgba(255,255,255,.2);stroke:rgba(255,255,255,.55);stroke-width:1.5;transition:fill .25s}
  .dia .base.on{fill:var(--accent);stroke:#fff;filter:drop-shadow(0 0 5px rgba(255,194,14,.7))}

  /* ---------- situation strip ---------- */
  .strip{display:flex;align-items:center;gap:26px;max-height:0;opacity:0;overflow:hidden;padding:0 30px;
         background:var(--panel);border-radius:0 0 14px 14px;border-top:1px solid rgba(255,255,255,.08);
         font-size:29px;font-weight:600;letter-spacing:2.2px;text-transform:uppercase;white-space:nowrap;
         transition:max-height .45s cubic-bezier(.3,.9,.3,1),opacity .35s,padding .45s;
         filter:drop-shadow(0 8px 12px rgba(0,0,0,.4))}
  .strip.on{max-height:56px;opacity:1;padding:5px 30px 7px}
  .strip .hl{color:var(--accent);font-weight:800}
  .strip .dim{opacity:.7}
  .strip .grp{display:flex;align-items:center;gap:9px}
  .strip .k{font-weight:800;opacity:.85}
  .lamp{width:17px;height:17px;border-radius:50%;background:rgba(255,255,255,.16)}
  .lamp.b.on{background:#3ddc84;box-shadow:0 0 8px rgba(61,220,132,.6)}
  .lamp.s.on{background:#ffc20e;box-shadow:0 0 8px rgba(255,194,14,.6)}
  .lamp.o.on{background:#ff4d4f;box-shadow:0 0 8px rgba(255,77,79,.6)}
  .sets .sc{display:flex;align-items:baseline;gap:8px}
  .sets .sc b{color:var(--accent);font-weight:800;font-size:23px}

  /* ---------- banner ---------- */
  .banner{align-self:stretch;margin-top:0;max-height:0;opacity:0;overflow:hidden;border-radius:12px;
          display:flex;align-items:center;justify-content:center;text-align:center;
          background:var(--bc,#ffc20e);color:var(--bt,#0b0e13);
          font-weight:800;font-size:38px;letter-spacing:4px;text-transform:uppercase;line-height:1;
          transition:max-height .5s cubic-bezier(.3,.9,.3,1),opacity .35s,margin-top .5s;
          filter:drop-shadow(0 8px 14px rgba(0,0,0,.45))}
  .banner.show{max-height:64px;opacity:1;margin-top:38px;padding:0 24px}
  .banner span{display:block;padding:11px 0 12px}
  .sport-baseball .banner.show{margin-top:14px}
</style>
</head>
<body>
<div id="stage"><div id="bug" class="sport-football"><div id="inner" class="off"></div></div></div>

<script src="/config.js"></script>
<script>
(function () {
'use strict';
var params = new URLSearchParams(location.search);
if (params.get('checker')) document.body.classList.add('checker');

var $ = function (s, r) { return (r || document).querySelector(s); };
var stage = $('#stage'), bug = $('#bug'), inner = $('#inner');

function fitStage() {
  var k = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = 'scale(' + k + ')';
}
addEventListener('resize', fitStage); fitStage();

/* ---------- skeleton ---------- */
function teamHTML() {
  return '<div class="logo"><img alt=""></div>' +
         '<div class="tname"><span class="nm"></span><span class="rec"></span></div>' +
         '<div class="poss"></div>' +
         '<div class="score"><span class="val"></span></div>' +
         '<div class="foot"><div class="fl grp"></div><div class="fr grp"></div></div>';
}
inner.innerHTML =
  '<div class="bar"><div class="team left" id="tL">' + teamHTML() + '</div>' +
  '<div class="center" id="center"></div>' +
  '<div class="team right" id="tR">' + teamHTML() + '</div></div>' +
  '<div class="strip" id="strip"></div>' +
  '<div class="banner" id="banner"><span id="bannerText"></span></div>';
var tL = $('#tL'), tR = $('#tR'), center = $('#center'), strip = $('#strip'),
    banner = $('#banner'), bannerText = $('#bannerText');

var DIAMOND = '<svg class="dia" viewBox="0 0 62 62">' +
  '<rect class="base b2" x="-8" y="-8" width="16" height="16" transform="translate(31 13) rotate(45)"/>' +
  '<rect class="base b1" x="-8" y="-8" width="16" height="16" transform="translate(49 31) rotate(45)"/>' +
  '<rect class="base b3" x="-8" y="-8" width="16" height="16" transform="translate(13 31) rotate(45)"/></svg>';

var ICON = {
  football: '<svg viewBox="0 0 24 24"><g transform="rotate(-40 12 12)"><ellipse cx="12" cy="12" rx="10.5" ry="6.5"/>' +
            '<path d="M12 8.600v6.800M9.600 10.300h4.800M9.600 12h4.800M9.600 13.700h4.800" stroke="#0b0e13" stroke-width="1.300" fill="none" stroke-linecap="round"/></g></svg>',
  ballL: '<svg viewBox="0 0 24 24"><path d="M5 4l15 8-15 8z"/></svg>',
  ballR: '<svg viewBox="0 0 24 24"><path d="M19 4L4 12l15 8z"/></svg>',
  volley: '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 2c1.600 0 3.100.5 4.300 1.300-1.800.5-3.400 1.600-4.300 3.200-1-1.600-2.500-2.700-4.300-3.200C8.900 4.500 10.400 4 12 4zM4.200 9.500c2 .2 3.700 1.200 4.700 2.800-1.400 1.200-3.200 1.900-5.100 1.800A8 8 0 014.200 9.500zm.7 6.500c2.100.1 4.100-.6 5.600-2 .8 1.600.9 3.400.3 5.200A8 8 0 014.900 16zm9.700 3.200c-.6-1.800-.5-3.600.3-5.200 1.500 1.400 3.500 2.100 5.600 2a8 8 0 01-5.900 3.200zm5.600-5.100c-1.900.1-3.700-.6-5.100-1.800 1-1.600 2.700-2.600 4.700-2.800.5 1.500.6 3 .4 4.600z"/></svg>'
};

/* ---------- helpers ---------- */
function hexRGB(h) {
  h = String(h || '#000').replace('#', '');
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  var n = parseInt(h, 16); if (isNaN(n)) n = 0;
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function lum(h) {
  var c = hexRGB(h).map(function (v) { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); });
  return .2126 * c[0] + .7152 * c[1] + .0722 * c[2];
}
function contrast(h) { return lum(h) > .3 ? '#0b0e13' : '#ffffff'; }

function setRoll(el, text) {
  text = String(text);
  if (el.dataset.v === text) return;
  var first = el.dataset.v === undefined;
  el.dataset.v = text;
  if (el._a) { el._a.cancel(); el._a = null; }
  if (first || inner.classList.contains('off')) { el.textContent = text; return; }
  var out = el.animate([{ transform: 'translateY(0)', opacity: 1 }, { transform: 'translateY(-45%)', opacity: 0 }],
                       { duration: 130, easing: 'ease-in' });
  el._a = out;
  out.onfinish = function () {
    el.textContent = text;
    el._a = el.animate([{ transform: 'translateY(45%) scale(.9)', opacity: 0 }, { transform: 'translateY(0) scale(1)', opacity: 1 }],
                       { duration: 260, easing: 'cubic-bezier(.2,.9,.3,1.25)' });
  };
}

function periodLabel(sp, p) {
  if (sp === 'soccer') return p >= 1 && p <= 4 ? ['1ST', '2ND', 'ET 1', 'ET 2'][p - 1] : 'PENS';
  var base = ['1ST', '2ND', '3RD', '4TH'];
  if (p >= 1 && p <= 4) return base[p - 1];
  return p === 5 ? 'OT' : (p - 4) + 'OT';
}
function ordinal(n) { return ['', '1ST', '2ND', '3RD', '4TH'][n] || String(n); }

function pips(n, max, cls) {
  var h = '';
  for (var i = 0; i < max; i++) h += '<span class="pip ' + (cls || '') + (i < n ? '' : ' off') + '"></span>';
  return h;
}
function lamps(n, max, cls) {
  var h = '';
  for (var i = 0; i < max; i++) h += '<span class="lamp ' + cls + (i < n ? ' on' : '') + '"></span>';
  return h;
}
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

/* ---------- state ---------- */
var S = null, offset = 0, builtSport = null, fontEpoch = 0;
var prevScore = {};

function buildSport(sp) {
  bug.className = 'sport-' + sp;
  var h;
  if (sp === 'football' || sp === 'basketball' || sp === 'soccer') h = '<div class="per"></div><div class="clkrow"><div class="clk">0:00</div><div class="add"></div></div>';
  else if (sp === 'volleyball') h = '<div class="per">SET</div><div class="clk"></div>';
  else h = '<div class="inn"><svg class="tri" viewBox="0 0 20 20"><path d="M10 3L18 16H2z"/></svg><span class="innnum"></span></div>' + DIAMOND;
  center.innerHTML = h;
  builtSport = sp;
  prevScore = {};
  tL.querySelector('.score .val').removeAttribute('data-v');
  tR.querySelector('.score .val').removeAttribute('data-v');
}

function fitName(el, text, side) {
  var nm = el.querySelector('.nm'), tn = el.querySelector('.tname'), MAX = 270, MIN = 170;
  nm.style.transform = 'none';
  nm.textContent = text;
  var w = nm.scrollWidth, eff = Math.min(w, MAX);
  nm.style.transformOrigin = side === 'right' ? 'right center' : 'left center';
  nm.style.transform = w > MAX ? 'scaleX(' + (MAX / w) + ')' : 'none';
  tn.style.width = (Math.max(eff, MIN) + 40) + 'px';
}

function renderTeam(el, t, side, st, s) {
  var sp = s.sport, g = s.game;
  el.style.setProperty('--c1', t.color);  el.style.setProperty('--t1', contrast(t.color));
  el.style.setProperty('--c2', t.color2); el.style.setProperty('--t2', contrast(t.color2));
  el.style.color = contrast(t.color);

  var logo = el.querySelector('.logo'), img = logo.querySelector('img');
  if (t.logo) { if (img.getAttribute('src') !== t.logo) img.src = t.logo; logo.style.display = 'flex'; }
  else { logo.style.display = 'none'; img.removeAttribute('src'); }
  logo.className = 'logo' + (t.logoPlate === 'white' ? ' plate-white' : t.logoPlate === 'dark' ? ' plate-dark' : '');

  var text = st.nameMode === 'abbr' ? (t.abbr || t.name) : t.name;
  var key = text + '|' + side + '|' + fontEpoch;
  if (el.dataset.nk !== key) { el.dataset.nk = key; fitName(el, text, el.classList.contains('right') ? 'right' : 'left'); }
  var rec = el.querySelector('.rec');
  rec.textContent = t.record || ''; rec.style.display = t.record ? 'block' : 'none';

  var score = el.querySelector('.score');
  setRoll(score.querySelector('.val'), t.score);
  var pv = prevScore[side];
  if (pv !== undefined && t.score > pv && !inner.classList.contains('off')) {
    score.classList.remove('flash'); void score.offsetWidth; score.classList.add('flash');
  }
  prevScore[side] = t.score;

  var poss = el.querySelector('.poss'), has = (sp === 'football' || sp === 'basketball' || sp === 'volleyball') && g.possession === side;
  poss.classList.toggle('on', has);
  if (has) {
    var isLeft = el.classList.contains('left');
    poss.innerHTML = sp === 'football' ? ICON.football : sp === 'volleyball' ? ICON.volley : (isLeft ? ICON.ballL : ICON.ballR);
  }

  var fl = el.querySelector('.fl'), fr = el.querySelector('.fr');
  if (sp !== 'soccer') el.querySelector('.foot').classList.remove('nocards');
  if (sp === 'football') {
    fl.innerHTML = '<span class="lbl">T.O.</span>' + pips(t.timeouts, g.toMax); fr.innerHTML = '';
  } else if (sp === 'basketball') {
    fl.innerHTML = '<span class="lbl">T.O.</span>' + pips(t.timeouts, g.toMax);
    var oppF = (s.teams[side === 'home' ? 'away' : 'home'] || {}).fouls || 0;
    var bonus = oppF >= 5 ? 'BONUS' : '';  // this team is in the bonus once the OPPONENT has 5 team fouls in the quarter / OT
    fr.innerHTML = '<span class="lbl">FOULS</span><span>' + t.fouls + '</span>' + (bonus ? '<span class="bonus">' + bonus + '</span>' : '');
  } else if (sp === 'soccer') {
    var cd = (g.cards && g.cards[side]) || { yellow: 0, red: 0 }, ch = '';
    for (var yi = 0; yi < Math.min(cd.yellow, 4); yi++) ch += '<span class="card y"></span>';
    for (var ri = 0; ri < Math.min(cd.red, 4); ri++) ch += '<span class="card r"></span>';
    fl.innerHTML = ch; fr.innerHTML = '';
    el.querySelector('.foot').classList.toggle('nocards', !ch);
  } else if (sp === 'volleyball') {
    var need = Math.ceil(g.bestOf / 2);
    fl.innerHTML = '<span class="lbl">SETS</span>' + pips(g.sets[side], need, 'set');
    fr.innerHTML = '<span class="lbl">T.O.</span>' + pips(t.timeouts, g.toMax);
  } else { fl.innerHTML = ''; fr.innerHTML = ''; }
}

function renderCenter() {
  var sp = S.sport, g = S.game;
  if (sp === 'football' || sp === 'basketball' || sp === 'soccer') {
    center.querySelector('.per').textContent = S.periodText || periodLabel(sp, S.period);
    center.classList.toggle('noclk', S.styles[sp].showClock === false || (sp === 'soccer' && S.period > 4));
    var add = center.querySelector('.add');
    var extra = sp === 'soccer' ? (g.stoppage | 0) : 0;
    add.textContent = extra > 0 ? '+' + extra : '';
    add.classList.toggle('on', extra > 0);
  } else if (sp === 'volleyball') {
    center.querySelector('.per').textContent = S.periodText || 'SET';
    setRoll(center.querySelector('.clk'), S.period);
  } else {
    setRoll(center.querySelector('.innnum'), g.inning);
    center.querySelector('.tri').classList.toggle('bot', g.half === 'bot');
    ['b1', 'b2', 'b3'].forEach(function (b, i) { center.querySelector('.' + b).classList.toggle('on', !!g.bases[i]); });
  }
}

function renderStrip() {
  var sp = S.sport, g = S.game, h = '', T = S.teams;
  if (sp === 'football') {
    if (g.down >= 1) {
      var tg = String(g.toGo).trim();
      h = '<span class="hl">' + ordinal(g.down) + (tg ? ' &amp; ' + esc(tg) : '') + '</span>';
      if (g.ballOn) h += '<span>BALL ON ' + esc(g.ballOn) + '</span>';
    } else if (g.ballOn) h = '<span>BALL ON ' + esc(g.ballOn) + '</span>';
  } else if (sp === 'baseball') {
    h = '<span class="grp"><span class="k">B</span>' + lamps(g.balls, 3, 'b') + '</span>' +
        '<span class="grp"><span class="k">S</span>' + lamps(g.strikes, 2, 's') + '</span>' +
        '<span class="grp"><span class="k">O</span>' + lamps(g.outs, 3, 'o') + '</span>';
  } else if (sp === 'soccer') {
    if (g.pens && g.pens.active) {
      var Ls = S.styles.soccer.homeFirst ? 'home' : 'away', Rs = Ls === 'home' ? 'away' : 'home';
      var dots = function (arr) {
        var n = Math.max(5, arr.length), o = '';
        for (var i = 0; i < n; i++) o += '<span class="lamp ' + (i < arr.length ? (arr[i] ? 'pg on' : 'pm on') : '') + '"></span>';
        return o;
      };
      var tal = function (arr) { return arr.reduce(function (a, b) { return a + b; }, 0); };
      h = '<span class="grp">' + dots(g.pens[Ls]) + '</span><span class="hl">PENS ' + tal(g.pens[Ls]) + ' - ' + tal(g.pens[Rs]) + '</span><span class="grp">' + dots(g.pens[Rs]) + '</span>';
    }
  } else if (sp === 'volleyball') {
    if (g.setScores.length) {
      h = g.setScores.map(function (r, i) {
        return '<span class="sc"><b>S' + (i + 1) + '</b>' + r.home + '-' + r.away + '</span>';
      }).join('');
      var st = S.styles[sp];
      if (st.homeFirst === false) h = g.setScores.map(function (r, i) {
        return '<span class="sc"><b>S' + (i + 1) + '</b>' + r.away + '-' + r.home + '</span>';
      }).join('');
      strip.classList.add('sets');
    }
  }
  if (sp !== 'volleyball') strip.classList.remove('sets');
  strip.innerHTML = h;
  strip.classList.toggle('on', h !== '');
}

function renderBanner() {
  var b = S.banner, c = b.color || S.styles[S.sport].accent;
  banner.style.setProperty('--bc', c);
  banner.style.setProperty('--bt', contrast(c));
  if (b.text) bannerText.textContent = b.text;
  banner.classList.toggle('show', !!(b.visible && b.text));
}

function applyLayout(st) {
  var m = 48, pos = (st.position || 'top-left').split('-'), v = pos[0], hz = pos[1], tx = '0', ox, oy;
  bug.style.left = bug.style.right = bug.style.top = bug.style.bottom = 'auto';
  if (hz === 'left') { bug.style.left = (m + st.offsetX) + 'px'; ox = 'left'; }
  else if (hz === 'right') { bug.style.right = (m - st.offsetX) + 'px'; ox = 'right'; }
  else { bug.style.left = (960 + st.offsetX) + 'px'; tx = '-50%'; ox = 'center'; }
  if (v === 'top') { bug.style.top = (m + st.offsetY) + 'px'; oy = 'top'; }
  else { bug.style.bottom = (m - st.offsetY) + 'px'; oy = 'bottom'; }
  bug.style.transformOrigin = ox + ' ' + oy;
  bug.style.transform = 'translateX(' + tx + ') scale(' + st.scale + ')';
}

function render() {
  if (!S) return;
  var sp = S.sport, st = S.styles[sp];
  if (builtSport !== sp) buildSport(sp);
  bug.style.setProperty('--panel', st.panel);
  bug.style.setProperty('--accent', st.accent);
  applyLayout(st);

  var L = st.homeFirst ? 'home' : 'away', R = st.homeFirst ? 'away' : 'home';
  renderTeam(tL, S.teams[L], L, st, S);
  renderTeam(tR, S.teams[R], R, st, S);
  renderCenter();
  renderStrip();
  renderBanner();
  inner.classList.toggle('off', !S.visible);
}

/* ---------- game clock (interpolated locally between server updates) ---------- */
function clockMs() {
  var c = S.clock;
  if (!c.running) return c.ms;
  return Math.max(0, c.ms + c.dir * (Date.now() + offset - c.anchor));
}
function fmtClock(ms, tenths, dir) {
  if (tenths && ms < 60000) {
    var t = Math.floor(ms / 100);
    return Math.floor(t / 10) + '.' + (t % 10);
  }
  var sec = dir < 0 ? Math.ceil(ms / 1000) : Math.floor(ms / 1000);
  var m = Math.floor(sec / 60), s = sec % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}
function tick() {
  if (S && (S.sport === 'football' || S.sport === 'basketball' || S.sport === 'soccer')) {
    var el = center.querySelector('.clk');
    if (el) { var t = fmtClock(clockMs(), S.clock.tenths, S.clock.dir); if (el.textContent !== t) el.textContent = t; }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { fontEpoch++; render(); });

/* ---------- connection ---------- */
function connect() {
  var ws = new WebSocket('ws://' + location.hostname + ':' + window.SCOREBUG.wsPort);
  ws.onopen = function () { ws.send(JSON.stringify({ type: 'hello', role: 'overlay' })); };
  ws.onmessage = function (e) {
    var m; try { m = JSON.parse(e.data); } catch (x) { return; }
    if (m.type === 'state') { offset = m.t - Date.now(); S = m.state; render(); }
  };
  ws.onclose = function () { setTimeout(connect, 1500); };
  ws.onerror = function () { try { ws.close(); } catch (x) {} };
}
connect();

window.__scorebug = { render: function (state) { S = state; offset = 0; render(); } };   // used for offline testing
})();
</script>
